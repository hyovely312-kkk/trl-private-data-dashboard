<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Event Lookup</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body data-events-page="lookup">
  <div class="app-shell">
    <aside class="sidebar"><div class="brand"><strong>KoTRL-X</strong><span>event lookup</span></div><nav class="nav"><a href="../index.html">Dashboard</a><a href="../input.html">Project Input</a><a href="../result.html">Result</a><a href="../agents.html">Agent Logs</a><a href="../events.html">Events</a><a href="../architecture.html">Architecture</a><a href="../rules.html">Rules</a></nav></aside>
    <main class="main">
      <header class="topbar"><div><h1>Event Lookup</h1><p>필터와 상세 패널로 KoTRL-X reasoning event를 조회합니다.</p></div><a class="button" href="../events.html">Back to Events Hub</a></header>
      <section class="grid two-col"><div class="panel"><div class="filters"><input id="keyword" placeholder="keyword search"><select id="classFilter"><option value="">All classes</option><option>Low</option><option>Mid</option><option>High</option></select><input id="minConfidence" type="number" min="0" max="1" step="0.01" value="0" title="min confidence"><input id="maxConfidence" type="number" min="0" max="1" step="0.01" value="1" title="max confidence"><select id="agentType"><option value="">All logs</option><option value="retrieval_agent">Retrieval</option><option value="pseudo_start_agent">Pseudo</option><option value="rubric_agent">Rubric</option><option value="fusion_agent">Fusion</option><option value="judge_agent">Judge</option><option value="report_agent">Report</option></select></div><div class="table-wrap"><table class="wide-table compact-table"><thead><tr><th>event_id</th><th>created_at</th><th>project_title</th><th>class</th><th>confidence</th><th></th></tr></thead><tbody id="eventRows"></tbody></table></div></div><div class="panel"><div class="section-title"><h2 id="eventDetailTitle">Event Detail</h2></div><pre id="eventDetail" class="json-view"></pre></div></section>
    </main>
  </div>
  <script src="../assets/js/config.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/events_pages.js"></script>
</body>
</html>
